<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Ayu Kartika</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/output.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("portfolio-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) document.documentElement.classList.add("dark");
    })();
  </script>
</head>
<body class="grid min-h-screen place-items-center bg-white px-6 font-body dark:bg-navy-900">
  <div class="data-grid-bg absolute inset-0 [mask-image:radial-gradient(ellipse_60%_50%_at_50%_30%,black,transparent)]"></div>

  <div class="relative mx-auto max-w-md text-center">
    <p class="font-mono text-sm text-accent">error &middot; 404</p>
    <h1 class="mt-3 font-display text-6xl font-extrabold text-navy-900 dark:text-white">Not found</h1>
    <p class="mt-4 text-ink-soft dark:text-navy-300">
      This page doesn't exist &mdash; or the query returned zero rows. Either way, let's get you back.
    </p>
    <a
      href="../index.html"
      class="mt-8 inline-flex items-center justify-center gap-2 rounded-xl bg-navy-700 px-6 py-3 font-semibold text-white shadow-soft transition-all duration-300 hover:-translate-y-0.5 hover:bg-navy-800 dark:bg-accent dark:hover:bg-accent-dark"
    >
      Back to homepage
    </a>
  </div>
</body>
</html>
