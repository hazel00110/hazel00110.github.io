<section id="home" class="relative overflow-hidden pt-32 pb-20 sm:pt-40 sm:pb-28">
  <div class="data-grid-bg absolute inset-0 [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,black,transparent)]"></div>

  <div class="relative mx-auto flex max-w-8xl flex-col items-start gap-10 px-5 sm:px-8 lg:flex-row lg:items-center lg:gap-16 lg:px-12">
    <div class="max-w-2xl reveal">
      <p class="section-eyebrow" data-bind="availability">Loading status\u2026</p>

      <h1 class="mt-5 text-4xl font-extrabold leading-[1.1] tracking-tight text-navy-900 dark:text-white sm:text-5xl lg:text-6xl">
        Hi, I'm <span data-bind="name">\u2014</span>.
      </h1>

      <p class="mt-3 font-mono text-lg text-accent sm:text-xl">
        <span data-typing aria-live="polite"></span><span class="animate-blink">|</span>
      </p>

      <p class="mt-6 max-w-xl text-base leading-relaxed text-ink-soft dark:text-navy-300 sm:text-lg" data-bind="intro">
        Loading introduction\u2026
      </p>

      <div class="mt-8 flex flex-wrap items-center gap-3">
        <a href="assets/pdf/CV_Hazel-Pernanda-Putra.pdf" download class="btn-primary">
          <i data-lucide="download" class="h-4 w-4"></i>Download CV
        </a>
        <a href="#contact" class="btn-secondary">
          <i data-lucide="mail" class="h-4 w-4"></i>Get in Touch
        </a>
      </div>

      <div data-social-icons class="mt-8 flex items-center gap-4"></div>
    </div>

    <div class="w-full max-w-md lg:max-w-sm reveal" style="transition-delay:120ms">
      <div class="card p-1.5">
        <div class="rounded-xl bg-navy-900 dark:bg-navy-950 p-5 font-mono text-[13px] leading-relaxed text-navy-200">
          <div class="mb-3 flex items-center gap-1.5">
            <span class="h-2.5 w-2.5 rounded-full bg-red-400/80"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-amber-400/80"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-400/80"></span>
            <span class="ml-2 text-navy-400">query.sql</span>
          </div>
          <p><span class="text-accent-light">SELECT</span> user_name</p>
          <p><span class="text-accent-light">FROM</span> users</p>
          <p><span class="text-accent-light">WHERE</span> role = <span class="text-emerald-300">'data_analyst'</span></p>
          <p><span class="text-accent-light">LIMIT</span> 1<span class="text-accent-light"></span>;</p>
        </div>

        <div data-hero-photo class="p-1.5 pt-3"></div>
      </div>
    </div>
  </div>
</section>
