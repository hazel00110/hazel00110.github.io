<section id="about" class="py-20 sm:py-28">
  <div class="mx-auto max-w-8xl px-5 sm:px-8 lg:px-12">
    <div class="reveal mx-auto max-w-2xl text-center">
      <p class="section-eyebrow justify-center">About</p>
      <h2 class="mt-3 text-3xl font-extrabold tracking-tight text-navy-900 dark:text-white sm:text-4xl">
        The short version
      </h2>
    </div>

    <div class="mt-14 grid gap-10 lg:grid-cols-5 lg:gap-14">
      <div class="reveal lg:col-span-3">
        <p class="text-base leading-relaxed text-ink-soft dark:text-navy-300 sm:text-lg" data-bind="about-summary">
          Loading\u2026
        </p>
        <p class="mt-5 text-base leading-relaxed text-ink-soft dark:text-navy-300 sm:text-lg" data-bind="about-objective">
          Loading\u2026
        </p>

        <div class="mt-8">
          <h3 class="text-sm font-semibold uppercase tracking-wide text-navy-800 dark:text-white">
            Outside the notebook
          </h3>
          <div data-interests-list class="mt-3 flex flex-wrap gap-2"></div>
        </div>
      </div>

      <div class="reveal lg:col-span-2" style="transition-delay:100ms">
        <div class="card p-6">
          <h3 class="flex items-center gap-2 text-sm font-semibold uppercase tracking-wide text-navy-800 dark:text-white">
            <i data-lucide="graduation-cap" class="h-4 w-4 text-accent"></i>Education
          </h3>
          <div data-about-education class="mt-4 space-y-4"></div>

          <h3 class="mt-8 flex items-center gap-2 text-sm font-semibold uppercase tracking-wide text-navy-800 dark:text-white">
            <i data-lucide="map-pin" class="h-4 w-4 text-accent"></i>Based in
          </h3>
          <p class="mt-2 text-sm text-ink-soft dark:text-navy-300" data-bind="location">\u2014</p>
        </div>
      </div>
    </div>
  </div>
</section>
